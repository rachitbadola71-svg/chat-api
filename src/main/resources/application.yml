spring:
  application:
    name: CHATAPI
  datasource:
    url: jdbc:mysql://localhost:3306/chatapi_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  error:
    include-message: always
    include-binding-errors: always